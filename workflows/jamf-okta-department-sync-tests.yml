name: Jamf Department Sync Tests

on:
  pull_request:
    paths:
      - 'jamf/automation/department_sync/**'
      - '.github/workflows/jamf-okta-department-sync*.yml'
  push:
    branches: [main]
    paths:
      - 'jamf/automation/department_sync/**'
      - '.github/workflows/jamf-okta-department-sync*.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r jamf/automation/department_sync/requirements.txt

      - name: Run mocked sync tests
        run: python -m unittest discover -s jamf/automation/department_sync -p 'test_*.py' -v
