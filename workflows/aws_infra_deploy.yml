name: AWS — Promote to Production

on:
  pull_request:
    branches: [main]
    paths: ['aws/terraform/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  plan:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_openai_admin_key: ${{ secrets.OPENAI_ADMIN_KEY }}
      TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_dd_site: ${{ secrets.DD_SITE }}
      TF_VAR_state_bucket: ${{ secrets.STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          printf "[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n[session]\naws_access_key_id = %s\naws_secret_access_key = %s\n" \
          "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
          "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
          > ~/.aws/credentials

      - name: Terraform Init
        working-directory: aws/terraform
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: aws/terraform
        run: |
          terraform plan -input=false -no-color -out=aws.plan || exit 1
          terraform show -no-color aws.plan > aws.showfile || true
          SUMMARY=$(grep -E "Plan:|No changes." aws.showfile || echo "Unable to parse summary")
          echo "plan_summary=$SUMMARY" >> $GITHUB_OUTPUT
          if grep -q "No changes." aws.showfile; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          chars=$(wc -c < aws.showfile)
          if (( chars > 65536 )); then
            echo "jumbo=true" >> $GITHUB_OUTPUT
          else
            echo "jumbo=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload jumbo plan
        if: steps.plan.outputs.jumbo == 'true'
        id: jumbo
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-showfile
          path: aws/terraform/aws.showfile

      - name: Post Slack — Plan Ready for Approval
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SUMMARY="${{ steps.plan.outputs.plan_summary }}"
          HAS_CHANGES="${{ steps.plan.outputs.has_changes }}"
          JUMBO="${{ steps.plan.outputs.jumbo }}"
          if [ "$HAS_CHANGES" = "false" ]; then
            PLAN_TEXT="✅ No changes detected."
          elif [ "$JUMBO" = "true" ]; then
            PLAN_TEXT="📎 Plan too large to display — see artifact in run logs.\n\`${SUMMARY}\`"
          else
            PLAN_CONTENT=$(cat aws/terraform/aws.showfile | head -c 2900 | sed 's/\\/\\\\/g; s/"/\\"/g; s/$/\\n/' | tr -d '\n')
            PLAN_TEXT="\`\`\`${PLAN_CONTENT}\`\`\`"
          fi
          printf '{"blocks":[{"type":"header","text":{"type":"plain_text","text":"🟡 AWS — Plan Ready for Approval","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":"*Summary:*\n`%s`"}]},{"type":"section","text":{"type":"mrkdwn","text":"%s"}},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"Approve & Apply","emoji":true},"url":"%s","style":"primary"}]}]}' \
          "$SUMMARY" "$PLAN_TEXT" "$RUN_URL" | \
          curl -X POST -H "Content-type: application/json" -d @- ${{ secrets.SLACK_WEBHOOK_URL }}

  apply:
    needs: plan
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_openai_admin_key: ${{ secrets.OPENAI_ADMIN_KEY }}
      TF_VAR_dd_api_key: ${{ secrets.DD_API_KEY }}
      TF_VAR_dd_site: ${{ secrets.DD_SITE }}
      TF_VAR_state_bucket: ${{ secrets.STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        run: |
          mkdir -p ~/.aws
          printf "[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n[session]\naws_access_key_id = %s\naws_secret_access_key = %s\n" \
          "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
          "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" \
          > ~/.aws/credentials

      - name: Terraform Init
        working-directory: aws/terraform
        run: terraform init -input=false

      - name: Terraform Apply
        working-directory: aws/terraform
        run: terraform apply -input=false -auto-approve

      - name: Post Slack — Applied to Production
        if: success()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          printf '{"blocks":[{"type":"header","text":{"type":"plain_text","text":"✅ Your changes have been pushed to production — AWS","emoji":true}},{"type":"section","fields":[{"type":"mrkdwn","text":"*Commit:*\n<%s|`%s`>"}]},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"View Logs","emoji":true},"url":"%s","style":"primary"}]}]}' \
          "$COMMIT_URL" "${COMMIT_SHA:0:7}" "$RUN_URL" | \
          curl -X POST -H "Content-type: application/json" -d @- ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Post Slack — Apply Failed
        if: failure()
        run: |
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          COMMIT_SHA="${{ github.sha }}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${COMMIT_SHA}"
          printf '{"blocks":[{"type":"header","text":{"type":"plain_text","text":"🔴 AWS — Apply FAILED","emoji":true}},{"type":"section","text":{"type":"mrkdwn","text":"Terraform apply failed.\n\n*Commit:* <%s|`%s`>"}},{"type":"actions","elements":[{"type":"button","text":{"type":"plain_text","text":"🔍 View Failure Logs","emoji":true},"url":"%s","style":"danger"}]}]}' \
          "$COMMIT_URL" "${COMMIT_SHA:0:7}" "$RUN_URL" | \
          curl -X POST -H "Content-type: application/json" -d @- ${{ secrets.SLACK_WEBHOOK_URL }}
